version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: artisticeye_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  
      MYSQL_DATABASE: artisticeye_db     
      MYSQL_USER: artisticeye_user       
      MYSQL_PASSWORD: strongpassword123  
    ports:
      - "3306:3306" 
    volumes:
      - db_data:/var/lib/mysql 
      - ./artisticeye_db.sql:/docker-entrypoint-initdb.d/artisticeye_db.sql

  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: artisticeye_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80" 

volumes:
  db_data: